name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libx11-6 libasound2-dev pkg-config libportaudio2
      - name: Build (Python 3.13 + Rust extension)
        run: uv sync --python 3.13
      - name: Tests
        run: uv run pytest -q
      - name: Rust lint
        run: cargo clippy --manifest-path rust/Cargo.toml -- -D warnings
