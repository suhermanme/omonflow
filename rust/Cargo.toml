[package]
name = "omonflow_core"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "OmonFlow native core (audio capture in M03; global shortcuts)"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py313"] }
global-hotkey = "0.9"
cpal = "0.18"
rtrb = "0.4"
